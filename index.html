<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video id="backgroundVideo" autoplay loop muted>
        <source src="media/katana-forest.1920x1080.mp4" type="video/mp4">
    </video>

    <div id="clock"></div>
    
    <!-- Took this css art from https://codepen.io/safikumar00/pen/YzMVeOG -->
    <div class="con">
        <div class="bowl-outer">
          <div class="bowl-inner">
            <div class="egg">
              <div class="yok"></div>
            </div>
            <div class="egg">
              <div class="yok"></div>
            </div>
            <div class="raddish"></div>
            <div class="raddish ra-sec"></div>
            <div class="raddish ra-three"></div>
            <div class="sea-weed"></div>
            <div class="sea-weed sea-weed-sec"></div>
            <div class="beef"></div>
            <div class="beef beef-sec"></div>
          </div>
        </div>
      </div>
      <div class="shadow-con">
        <div class="shadow"></div>
      </div>
      <div class="sticks">
        <div class="stick-1"></div>
        <div class="stick-2"></div>
      </div>
    <button id="toggleButton"></button>

    



    <div class="container" id="registerContainer">
        <h2>Create Your Samurai</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Nickname" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="loginBtn">Submit</button>
        </form>
    </div>   

    <!---------------------------->

    <div class="yin-yang">
        <div class="yin-yang__yin"></div>
        <div class="yin-yang__yang"></div>
    </div>


    <!----------------------->


    <script src="script.js"></script>
</body>
</html>
