<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS file -->
</head>
<body>
    <video id="backgroundVideo" autoplay loop muted>
        <source src="media/katana-forest.1920x1080.mp4" type="video/mp4">
    </video>

    <h2>Class Information Form</h2>
    <form id="classForm">
        <label for="className">Class Name:</label>
        <input type="text" id="className" name="className" class="formclass"required>
        
        <label for="numPeople">Number of People:</label>
        <input type="number" id="numPeople" name="numPeople" class="formclass" required>
        
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" class="formclass"required>
        
        <button type="submit">Add Class</button>
    </form>
    
    <h2>Class List</h2>
    <table id="classTable">
        <thead>
            <tr>
                <th>Class Name</th>
                <th>Number of People</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be added here dynamically -->
        </tbody>
    </table>
    
    <script src="tableScript.js"></script> <!-- Link to JavaScript file -->
</body>
</html>
